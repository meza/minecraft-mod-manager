name: Verify and Release

permissions:
  issues: write
  checks: write
  contents: write
  pull-requests: write

on:
  - push
  - pull_request

env:
  LEFTHOOK: 0

jobs:
  e2e:
    name: Terminal E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.25.5
          cache: true

      - name: Install make on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install make --no-progress --yes

      - name: Install pinned tui-test on Linux and macOS
        if: runner.os != 'Windows'
        shell: bash
        env:
          TUI_TEST_INSTALL_DIR: ${{ runner.temp }}/tui-test/bin
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64)
              asset=tui-test-x86_64-unknown-linux-gnu.tar.gz
              sha256=e54ff48914e1d1e8250c7b9b34bd7a1e5915f802fc7492ce832554fcebf570b5
              ;;
            Linux-ARM64)
              asset=tui-test-aarch64-unknown-linux-gnu.tar.gz
              sha256=f6cf1624cd722c36cc834b524fd50b493f66f8c4fb4a604b713fbc08e189ae3c
              ;;
            macOS-X64)
              asset=tui-test-x86_64-apple-darwin.tar.gz
              sha256=16143bf7cbbc29ecf9493cea15843a13cbba56f9952e530396091de96e33c59b
              ;;
            macOS-ARM64)
              asset=tui-test-aarch64-apple-darwin.tar.gz
              sha256=a5a49eec33b8f977f3f1a782f0f8d81f0978a14e0407a6a5f15619d6ccd3c89c
              ;;
            *)
              echo "Unsupported runner: $RUNNER_OS-$RUNNER_ARCH" >&2
              exit 1
              ;;
          esac
          archive="$RUNNER_TEMP/$asset"
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/microsoft/tui-test/releases/download/0.1.0-beta.2/$asset" \
            --output "$archive"
          if command -v sha256sum >/dev/null 2>&1; then
            echo "$sha256  $archive" | sha256sum --check
          else
            echo "$sha256  $archive" | shasum --algorithm 256 --check
          fi
          mkdir -p "$TUI_TEST_INSTALL_DIR"
          tar -xzf "$archive" -C "$TUI_TEST_INSTALL_DIR"
          echo "$TUI_TEST_INSTALL_DIR" >> "$GITHUB_PATH"

      - name: Install pinned tui-test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TUI_TEST_INSTALL_DIR: ${{ runner.temp }}\tui-test\bin
        run: |
          if ($env:RUNNER_ARCH -ne 'X64') {
            throw "Unsupported Windows runner architecture: $env:RUNNER_ARCH"
          }
          $asset = 'tui-test-x86_64-pc-windows-msvc.zip'
          $expectedSha256 = '9b34bfdc43b250a0f4e6adb0cb127f1749958483a2e6396dacf91bf7566b2593'
          $archive = Join-Path $env:RUNNER_TEMP $asset
          Invoke-WebRequest "https://github.com/microsoft/tui-test/releases/download/0.1.0-beta.2/$asset" -OutFile $archive
          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "tui-test archive checksum mismatch: expected $expectedSha256, got $actualSha256"
          }
          New-Item -ItemType Directory -Force -Path $env:TUI_TEST_INSTALL_DIR | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $env:TUI_TEST_INSTALL_DIR -Force
          $env:TUI_TEST_INSTALL_DIR | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run terminal E2E scenarios
        run: make e2e

  release:
    runs-on: self-hosted
    steps:
      - uses: meza/action-go-setup@main
        id: go
        name: Set up Go
        with:
          go-version: 1.25.5

      - name: Lint
        run: make lint

      - name: Vulnerability scan
        run: make vuln

      - name: Check coverage
        run: make coverage

      - name: Race tests
        run: make test-race

      - name: Build Distributables
        run: make build
        env:
          MODRINTH_API_KEY: ${{ secrets.MODRINTH_API_KEY }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}

      - name: Generate third-party notices
        run: make notices

      - name: Generate SBOM
        run: make sbom

