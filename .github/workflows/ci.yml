name: Verify and Release

permissions:
  issues: write
  checks: write
  contents: write
  pull-requests: write

on:
  - push
  - pull_request

env:
  LEFTHOOK: 0

jobs:
  e2e:
    name: Terminal E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - meza-ubuntu-slim
          - meza-windows-slim
          # - meza-macos
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: true
          cache-dependency-path: go.sum

      - name: Install pinned make on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'make.4.4.1.zip'
          $installDir = Join-Path $env:RUNNER_TEMP 'make'
          $expectedSha256 = '8b2dec73ed4c84163c4a4f9bfe658553b1e3d1fdfa8930d2aa438e030ff21f9d'
          Invoke-WebRequest 'https://community.chocolatey.org/api/v2/package/make/4.4.1' -OutFile $archive
          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "make package checksum mismatch: expected $expectedSha256, got $actualSha256"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $installDir -Force
          Join-Path $installDir 'tools/install/bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install pinned tui-test on Linux and macOS
        if: runner.os != 'Windows'
        shell: bash
        env:
          TUI_TEST_INSTALL_DIR: ${{ runner.temp }}/tui-test/bin
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64)
              asset=tui-test-x86_64-unknown-linux-gnu.tar.gz
              sha256=ae1f32afb34c713284b0637ea41d855124fe0ac298defb38a4018cd952c158ca
              ;;
            Linux-ARM64)
              asset=tui-test-aarch64-unknown-linux-gnu.tar.gz
              sha256=99588dd2e296f9b2685d7fb71d68a3dde3b1fed8c0e8f1af4d215538e858bd09
              ;;
            macOS-X64)
              asset=tui-test-x86_64-apple-darwin.tar.gz
              sha256=298ae3d37549d4712a7795d388f4e871f3bf8b7863372c3441787870c747408d
              ;;
            macOS-ARM64)
              asset=tui-test-aarch64-apple-darwin.tar.gz
              sha256=a6819562a18031b212565f771d03fe9e5ec7d4f71b389394fd909cc66cee6b81
              ;;
            *)
              echo "Unsupported runner: $RUNNER_OS-$RUNNER_ARCH" >&2
              exit 1
              ;;
          esac
          archive="$RUNNER_TEMP/$asset"
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/microsoft/tui-test/releases/download/0.1.1/$asset" \
            --output "$archive"
          if [ "$RUNNER_OS" = macOS ]; then
            echo "$sha256  $archive" | shasum -a 256 -c
          else
            echo "$sha256  $archive" | sha256sum -c
          fi
          mkdir -p "$TUI_TEST_INSTALL_DIR"
          tar -xzf "$archive" -C "$TUI_TEST_INSTALL_DIR"
          echo "$TUI_TEST_INSTALL_DIR" >> "$GITHUB_PATH"

      - name: Install pinned tui-test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TUI_TEST_INSTALL_DIR: ${{ runner.temp }}\tui-test\bin
        run: |
          if ($env:RUNNER_ARCH -ne 'X64') {
            throw "Unsupported Windows runner architecture: $env:RUNNER_ARCH"
          }
          $asset = 'tui-test-x86_64-pc-windows-msvc.zip'
          $expectedSha256 = '1dfdc80c6394bb723c9f3e3cb919db5138f72c75855b8fba2051dadf89663856'
          $archive = Join-Path $env:RUNNER_TEMP $asset
          Invoke-WebRequest "https://github.com/microsoft/tui-test/releases/download/0.1.1/$asset" -OutFile $archive
          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "tui-test archive checksum mismatch: expected $expectedSha256, got $actualSha256"
          }
          New-Item -ItemType Directory -Force -Path $env:TUI_TEST_INSTALL_DIR | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $env:TUI_TEST_INSTALL_DIR -Force
          $env:TUI_TEST_INSTALL_DIR | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run terminal E2E scenarios
        run: make e2e

  release:
    runs-on: meza-ubuntu-slim
    steps:
      - uses: meza/action-go-setup@c78a8df36a2e434db368347b54e4e6aa0f874fd8 # main
        id: go
        name: Set up Go
        with:
          go-version: 1.27.3

      - name: Lint
        run: make lint

      - name: Vulnerability scan
        run: make vuln

      - name: Check coverage
        run: make coverage

      - name: Race tests
        run: make test-race

      - name: Build Distributables
        run: make build
        env:
          MODRINTH_API_KEY: ${{ secrets.MODRINTH_API_KEY }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}

      - name: Generate third-party notices
        run: make notices

      - name: Generate SBOM
        run: make sbom

#      - name: Release
#        if: ${{ steps.go.outputs.new-release-published == 'true'  }}
#        env:
#          GH_TOKEN: ${{ secrets.GH_TOKEN }}
#        run: |
#          npx semantic-release
